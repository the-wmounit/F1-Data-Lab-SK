<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>F1 Data Lab · Point de départ</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:45px auto;padding:0 22px;color:#1c2419;background:#f4f5ef}h1{font-size:32px;margin-bottom:10px}p{line-height:1.6}a{color:#3b551d}select{font:inherit;padding:9px;margin:15px 0}table{border-collapse:collapse;width:100%;margin-top:12px;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e1e5da;font-size:14px}th{background:#e7ecdf}caption{text-align:left;padding:10px 0;font-weight:600}.scroll{overflow:auto}#error{color:#923519}#reference{display:block;margin:25px 0}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #456629;outline-offset:3px}footer{margin-top:30px;color:#53624b;font-size:12px}</style></head><body><h1>F1 Data Lab</h1><p>Le point de départ de l’atelier : des résultats, une API locale, et tout à construire.</p><label for="races">Course </label><select id="races" disabled></select><p id="error" role="status"></p><div class="scroll"><table><caption id="caption">Chargement…</caption><thead><tr><th scope="col">Position</th><th scope="col">Pilote</th><th scope="col">Écurie</th><th scope="col">Points</th><th scope="col">Statut</th></tr></thead><tbody id="results"></tbody></table></div><a id="reference" href="/reference/" hidden>Ouvrir la version de référence →</a><footer>Données Jolpica préchargées · aucune connexion requise pendant l’atelier.</footer><script type="module">const select=document.querySelector('#races'),error=document.querySelector('#error');let races=[];const cell=(text)=>{const td=document.createElement('td');td.textContent=text;return td;};let generation=0;async function load(){const id=++generation;const r=races[Number(select.value)];try{const response=await fetch(`/api/results/${r.year}/${r.round}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(id!==generation)return;document.querySelector('#caption').textContent=r.name+' · '+r.year;document.querySelector('#results').replaceChildren(...data.drivers.map(d=>{const tr=document.createElement('tr');tr.append(...[d.position,d.name,d.team,d.points,d.status].map(cell));return tr;}));error.textContent='';}catch(e){error.textContent='Chargement impossible : '+e.message;}}select.onchange=load;try{const response=await fetch('/api/races');if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();races=Array.isArray(data)?data:data.races;if(!races.length)throw new Error('Catalogue vide');select.replaceChildren(...races.map((r,i)=>{const option=document.createElement('option');option.textContent=r.name;option.value=i;return option;}));select.disabled=false;await load();}catch(e){error.textContent='Catalogue indisponible : '+e.message;}try{const ref=await fetch('/reference/index.html',{method:'HEAD'});if(ref.ok&&ref.headers.get('content-type')?.includes('text/html'))document.querySelector('#reference').hidden=false;}catch{}</script></body></html>
